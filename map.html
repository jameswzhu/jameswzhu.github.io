<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Figtree', sans-serif;
    background: #FFF5EE;
    color: #00001a;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1rem;
  }

  header h1 {
    font-size: 1.85rem;
    font-weight: 400;
    letter-spacing: -0.4px;
    color: #00001a;
  }

  header p {
    font-family: 'Figtree', sans-serif;
    font-size: 0.82rem;
    color: #999;
    margin-top: 0.35rem;
    letter-spacing: 0.06em;
  }

  #map-wrap {
    position: relative;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  #map-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .country {
    fill: #F8C7BF;
    stroke: #c8c3bc;
    stroke-width: 0.6;
  }

  .country:hover { fill: #F3A495; }

  .graticule {
    fill: none;
    stroke: #e0dcd6;
    stroke-width: 0.3;
  }

  .ocean { fill: #FFF5EE; }

  .pin-group { cursor: pointer; }

  .pin-pulse {
    animation: pulse 2.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; r: 18; }
    50% { opacity: 0.08; r: 27; }
  }

  .pin-dot {
    transition: r 0.18s ease, filter 0.18s ease;
  }

  .pin-group:hover .pin-dot { r: 14; }

  .tooltip {
    position: absolute;
    background: #fff;
    border-top: 3px solid #ccc;
    border-radius: 10px;
    padding: 0;
    font-family: 'Figtree', sans-serif;
    font-size: 0.9rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    width: 220px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.14);
    z-index: 20;
    overflow: hidden;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-photo {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }
  .tooltip .tt-body {
    padding: 0.7rem 0.9rem;
  }
  .tooltip .tt-role { font-weight: 600; font-size: 0.9rem; color: #00001a; line-height: 1.35; }
  .tooltip .tt-inst { color: #666; margin-top: 3px; font-size: 0.78rem; }
  .tooltip .tt-city { color: #999; margin-top: 1px; font-size: 0.74rem; }
  .tooltip .tt-years { color: #aaa; margin-top: 4px; font-size: 0.78rem; font-style: italic; }

  footer {
    text-align: center;
    font-family: 'Figtree', sans-serif;
    font-size: 0.7rem;
    color: #ccc;
    padding-bottom: 2rem;
  }

  .loading-msg {
    text-align: center;
    font-family: 'Figtree', sans-serif;
    font-size: 0.8rem;
    color: #aaa;
    padding: 2rem;
  }
</style>
</head>
<body>

<header>
  <h1>My Journey</h1>
  <p>hover a pin to explore</p>
</header>

  <div class="tooltip" id="tooltip">

    </div>
  </div>
  <svg id="map-svg" viewBox="0 0 960 560"></svg>
</div>

const svg = d3.select("#map-svg");
const width = 960, height = 560;

const projection = d3.geoMercator()
  .center([-35, 38])
  .scale(430)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

svg.append("rect").attr("width", width).attr("height", height).attr("class", "ocean");

const graticule = d3.geoGraticule().step([10, 10]);
svg.append("path").datum(graticule()).attr("class", "graticule").attr("d", path);

try {
  const world = WORLD_TOPOJSON;
  const countries = topojson.feature(world, world.objects.countries);

  svg.selectAll(".country")
    .data(countries.features)
    .enter().append("path")
    .attr("class", "country")
    .attr("d", path);
} catch (e) {
  console.error("Map render error:", e);
}

drawPins();

function drawPins() {
  const tooltip = document.getElementById("tooltip");
  const ttPhoto = document.getElementById("tt-photo");
  const ttRole  = document.getElementById("tt-role");
  const ttInst  = document.getElementById("tt-inst");
  const ttCity  = document.getElementById("tt-city");
  const ttYears = document.getElementById("tt-years");
  const mapWrap = document.getElementById("map-wrap");

  POSITIONS.forEach(p => {
    const [px, py] = projection([p.lon, p.lat]);
    const g = svg.append("g").attr("class", "pin-group");

    g.append("circle")
      .attr("cx", px).attr("cy", py)
      .attr("r", 18)
      .attr("fill", p.color)
      .attr("fill-opacity", 0.18);

    g.append("circle")
      .attr("cx", px).attr("cy", py)
      .attr("r", 11)
      .attr("fill", p.color)
      .attr("stroke", "#fff")
      .attr("stroke-width", 2.5)
      .attr("class", "pin-dot")
      .style("filter", "drop-shadow(0 1px 3px rgba(0,0,0,0.18))");

    g.on("mouseenter", function(event) {
      ttPhoto.src         = p.image;
      ttPhoto.alt         = p.inst;
      ttRole.textContent  = p.role;
      ttInst.textContent  = p.inst;
      ttCity.textContent  = p.city;
      ttYears.textContent = p.years;
      tooltip.style.borderTopColor = p.color;
      tooltip.classList.add("visible");
      moveTip(event);
    })
    .on("mousemove", moveTip)
    .on("mouseleave", () => tooltip.classList.remove("visible"));
  });

  function moveTip(event) {
    const rect = mapWrap.getBoundingClientRect();
    let x = event.clientX - rect.left + 16;
    let y = event.clientY - rect.top - 12;
    if (x + 232 > rect.width) x = event.clientX - rect.left - 240;
    if (y + 210 > rect.height) y = event.clientY - rect.top - 210;
    tooltip.style.left = x + "px";
    tooltip.style.top  = y + "px";
  }
}
</script>
</body>
</html>
